name: Main testing workflow

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Build a binary wheel and a source tarball
        run: uv build
      - name: Check the distribution files with `twine`
        run: uv run --group build twine check --strict dist/*
      - name: Upload artifact
        id: artifact-upload-step
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/*
          if-no-files-found: error
          compression-level: 0 # They are already compressed
  test-run:
    runs-on: ubuntu-latest
    needs: build
    # Never fail the workflow for pre-release pythons, even when a step
    # outside of typecheck/test breaks (e.g. a dependency that does not
    # build yet on that version).
    continue-on-error: ${{ matrix.ignore-test-outcome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            toxfactor: py3.10
            ignore-typecheck-outcome: false
            ignore-test-outcome: false
          - python-version: "3.11"
            toxfactor: py3.11
            ignore-typecheck-outcome: false
            ignore-test-outcome: false
          - python-version: "3.12"
            toxfactor: py3.12
            ignore-typecheck-outcome: false
            ignore-test-outcome: false
          - python-version: "3.13"
            toxfactor: py3.13
            ignore-typecheck-outcome: false
            ignore-test-outcome: false
          - python-version: "3.14"
            toxfactor: py3.14
            ignore-typecheck-outcome: false
            ignore-test-outcome: false
          - python-version: "3.15-dev"
            toxfactor: py3.15
            ignore-typecheck-outcome: false
            ignore-test-outcome: false

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: uv sync --only-group dev

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Type checking
        # Ignore errors for older pythons
        continue-on-error: ${{ matrix.ignore-typecheck-outcome }}
        run: |
          source .venv/bin/activate
          tox -e mypy

      - name: Test with tox
        continue-on-error: ${{ matrix.ignore-test-outcome }}
        run: |
          source .venv/bin/activate
          coverage erase
          # Using `--parallel 4` as it's the number of CPUs in the GitHub Actions runner
          # Using `installpkg dist/*.tar.gz` because we want to install the pre-built package (want to test against that)
          tox run-parallel -f ${{ matrix.toxfactor }} --parallel 4 --parallel-no-spinner --parallel-live --installpkg dist/*.whl
          coverage combine
          coverage xml

      - uses: codecov/codecov-action@v4
        with:
          # Explicitly using the token to avoid Codecov rate limit errors
          # See https://community.codecov.com/t/upload-issues-unable-to-locate-build-via-github-actions-api/3954
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true # optional (default = false)

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-bdd
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs:
      - "test-run"
      - "build"
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
